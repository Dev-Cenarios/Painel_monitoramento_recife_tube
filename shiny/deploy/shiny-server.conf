# =============================================================================
# shiny-server.conf  --  Painel de Monitoramento da Tuberculose (Recife)
#
# POR QUE ESTE ARQUIVO EXISTE
# ---------------------------
# Os ganhos de performance do painel vivem todos no PROCESSO R:
#
#   - mod_data.R      .api_registry + memo_env  (objeto da API e resultados)
#   - mod_charts.R    microdado derivado e recortes por bairro
#   - mod_map.R       malha de bairros ja processada
#
# Juntos, eles levam a abertura de ~11 s (processo frio) para ~2,5 s. Mas isso
# vale SO ENQUANTO O PROCESSO VIVE. O Shiny Server encerra o processo R depois
# de `app_idle_timeout` segundos sem nenhuma conexao -- e leva todo o cache
# junto. Com o padrao, num painel de uso esporadico, praticamente todo visitante
# chega num processo recem-nascido e paga os ~11 s. Nenhuma otimizacao no codigo
# R muda isso: e configuracao de servidor.
#
# Este arquivo existe sobretudo por causa de uma linha: `app_idle_timeout 0`.
#
# COMO USAR
#   sudo cp shiny-server.conf /etc/shiny-server/shiny-server.conf
#   sudo systemctl restart shiny-server
#
# CONFIRA ANTES: se voces ja tem um conf com outras aplicacoes, NAO substitua o
# arquivo inteiro -- copie so o bloco `location` do painel e as diretivas
# comentadas abaixo.
# =============================================================================

run_as shiny;

# Mantem os logs de sessoes que terminaram em erro (por padrao sao apagados,
# o que torna impossivel investigar falha em producao).
preserve_logs true;

# Nao vazar caminho de arquivo e stack trace do servidor para o navegador.
# O app_shell.R ja faz isso via SINAN_DEBUG; aqui e cinto e suspensorio.
sanitize_errors true;

server {
  listen 3838;

  location /monitoramento-tuberculose {
    # app_dir tem de ser a pasta que contem o app.R: ele usa getwd() para
    # achar ../_utils/app_utils.R e o .Renviron. A raiz do projeto (a que tem
    # data/parquet) e /srv/shiny-server/monitoramento-tuberculose.
    app_dir /srv/shiny-server/monitoramento-tuberculose/shiny/core/apps/TUBERCULOSE;
    log_dir /var/log/shiny-server;

    # -------------------------------------------------------------------------
    # A LINHA QUE IMPORTA
    # -------------------------------------------------------------------------
    # 0 = nunca encerrar o processo R por ociosidade.
    #
    # O padrao do Shiny Server e encerrar poucos segundos depois da ultima
    # conexao fechar. Para um painel visitado de vez em quando, isso significa
    # que o cache nunca sobrevive de um visitante para o proximo.
    #
    # Custo: o processo fica residente. Meça o RSS depois de algumas horas --
    # os caches guardam o microdado (~27,6 mil linhas) e recortes por bairro,
    # entao espere algumas centenas de MB, nao alguns GB. Se a memoria da VM
    # for apertada, um meio-termo razoavel e `app_idle_timeout 3600`.
    app_idle_timeout 0;

    # -------------------------------------------------------------------------
    # Quantas sessoes compartilham um processo R
    # -------------------------------------------------------------------------
    # No Shiny Server Open Source o agendador e o `simple_scheduler`, que serve
    # ate N conexoes simultaneas com UM processo R. Isso e o que faz o cache por
    # processo valer entre usuarios diferentes -- se cada sessao tivesse seu
    # processo, os passos 2 e 3 so ajudariam quem recarregasse a propria aba.
    #
    # 20 e o padrao. Suba se houver mais gente simultanea que isso; lembre que
    # o R e single-thread, entao muitas sessoes num processo disputam CPU.
    simple_scheduler 20;

    # O painel carrega 14 pacotes e sourceia ~16 mil linhas antes de responder.
    # Num disco de VM isso passa fácil dos 60 s padrao, e o Shiny Server
    # desiste no meio, o que aparece como "Erro ao iniciar a aplicacao".
    app_init_timeout 300;

    # Quanto esperar por uma sessao que parou de responder.
    app_session_timeout 900;
  }

  # Demais apps do servidor, se houver.
  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}

# =============================================================================
# DEPOIS DE APLICAR, CONFIRA QUE FUNCIONOU
# =============================================================================
#
# 1) O processo sobrevive a ociosidade:
#      pgrep -af "R.*monitoramento-tuberculose"
#    Abra o painel, feche a aba, espere um minuto, rode de novo. O PID tem de
#    ser o MESMO. Se mudou, o app_idle_timeout nao pegou.
#
# 2) O cache esta valendo entre visitas:
#    a 1a visita depois do restart custa ~11 s; a 2a tem de cair para ~3 s.
#
# 3) O arrow do servidor tem suporte a dataset (se nao tiver, nada disso ajuda):
#      sudo -u shiny Rscript -e 'cat(names(which(unlist(arrow::arrow_info()$capabilities))), sep=", ")'
#    Tem de aparecer `dataset` na lista.
#
# 4) A geometria pre-processada existe no servidor:
#      ls -la /srv/shiny-server/monitoramento-tuberculose/data/geo/recife_bairros.rds
#    Se faltar, o mapa cai no caminho antigo (funciona, mas custa ~525 ms por
#    processo). Gere com:
#      Rscript shiny/scripts/preparar_geometria.R
# =============================================================================
